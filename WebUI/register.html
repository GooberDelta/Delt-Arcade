<!DOCTYPE html>
<html lang="">
  <head>
    <meta charset="utf-8">
    <link rel="icon" type="image/png" href="/assets/favicon.png">
    <link rel="stylesheet" href="/css/register.css">
    <link rel="stylesheet" href="/css/main.css">
    <title>Register | Delt-Arcade </title>
  </head>
  <body>
    <div class="login">
      <img class="text" src="/assets/logo-text.png" alt="Delt-Arcade Logo with Name only", style="height:30px"> <br>
      <p1>Register a new account</p1><br><br><br>
        <label for="username">Username</label>
        <input type="text", id="username", name="username"><br><br>
        <label for="displayname" class="dn">Display Name</label>
        <input type="text" id="displayname", name="displayname"><br><br>
        <label for="email" class="email">Email Address</label>
        <input type="text", id="email", name="email"><br><br>
        <label for="pw">Password</label>
        <input type="password" id="pw", name="pw"><br><br>
        <label for="pw", class="rtpw">Retype Password</label>
        <input type="password" id="rtpw", name="rtpw"><br><br>
        <p class="registration-text">Already have an account?</p>
        <a class="registration-link" href="/login">Login to an account</a>
        <button name="register" id="register"> Register</button>
      
    </div>
  </body>
  <footer>
    <p2>Made with ❤️ by DeltaDev</p2>
  </footer>
</html>

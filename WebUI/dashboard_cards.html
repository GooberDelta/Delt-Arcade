<!DOCTYPE html>
<html lang="">
  <head>
    <meta charset="utf-8">
    <link rel="icon" type="image/png" href="../assets/webpage/favicon.png">
    <link rel="stylesheet" href="/css/dashboard_cards.css">
    <link rel="stylesheet" href="/css/main.css">
    <title>Cards | Delt-Arcade </title>
    <script src="/js/dashboard-cards.js"></script>
    <script src="/js/main.js"></script>
    <script src="/js/disclaimer.js"></script>
    <script>authcheck()</script>
    <script>gud()</script>
    <script>guifd()</script>
  </head>
  <body>
    <div class="notification-web" id="web-notification"></div>
    <img src="/assets/webpage/fade_bg.png" id="bg_fade" style="display: none; position: absolute; top: 0%; left: 0%; width: 100%; height:100%;">
    <div class="card_forum" id="add_forum" style="display:none;">
      <h3 class="forum-title">Add a card to your account</h3> 
      <button class="close-popup-button" onclick="close_popup()"><img src="/assets/webpage/close_button.png"></button>
      <p class="forum-label">Card ID</p>
      <input class="input-forum" type="text" placeholder ="1234567">
      <p class="forum-label">Card PIN</p>
      <input class="input-forum" type="text" placeholder ="1234", maxlength="4">
      <p class="forum-label">Card Name</p>
      <input class="input-forum" type="text" placeholder="Main Card" >
      <button class="add-card-button-forum" onclick="add_card()">Add Card</button>
    </div>
      <ul id = "nav">
        <li><a class="NCE_LINK" href="/dashboard/overview">Overview</a></li>
        <li><a class="NCE_LINK" href="/dashboard/cards">Your Cards</a></li>
        <li class="accountbtn"><button class="accountbtn"><img class="profile_picture" id="profile-picture" src="/assets/profile_picture/default.png"><name= id="ddisplay">{User}</name><img src="/assets/webpage/dropdown_arrow.png"></button>
          <div class="dd-content">
            <a href="/dashboard/account">Account Settings</a>
            <a href="/logout">Log Out</a>
          </div>
        <li><a class="admin-button" href="/admin">Admin Panel</a></li>
        </li>
      </ul>
  
    <div>
      <div class="cardList">
        <p class="header">Cards assigned to account</p>
        <ul class="cardList", id="Card-List">
          <!--- <p class="No_Card_Error"> There are no cards currently assigned to this profile.</p> --->
        </ul>
      </div>
      <div class="cardOverview", id="card-area">
        <p id="no-card-select-notify">There is no card currently selected.</p>
          
        </div>
      <button class="add-card-button" onclick="start_add_process()">Add A Card</button>
      </div>
    </div>
  </body>
  <footer>
    <p>Made with ❤️ by DeltaDev</p>
  </footer>
</html>

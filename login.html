<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Login</title>
  <link rel="icon" type="image/png" href="assets/favicon.png"/>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;500;600;700&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="css/login.css"/>
</head>
<body>

  <!-- BACKGROUND IMAGE
       position:fixed keeps it covering the full viewport even on scroll.
       object-fit:cover scales it like "fill the frame, crop if needed".
       z-index:-1 puts it behind everything else on the page.
       The dark overlay div on top dims it so text stays readable. -->
  <div class="bg-wrap">
    <img src="assets/bg.png" alt="" aria-hidden="true" class="bg-img" />
    <div class="bg-overlay"></div>
  </div>

  <main>
    <div class="login-card">

      <div class="brand">
        <div class="logo-mark"><img src="assets/logo.png" alt="Delt-Arcade logo" /></div>
        <img src="assets/logo-text.png" alt="Delt-Arcade" style="height:36px;object-fit:contain;margin-top:0.25rem;"/>
        <p>Arcade Management System</p>
      </div>

      <!-- novalidate: disable ugly browser validation bubbles;
           we handle validation ourselves for consistent styled UX -->
      <form id="loginForm" novalidate>

        <div class="form-group">
          <label for="username">Username</label>
          <div class="input-wrap">
            <input type="text" id="username" name="username"
              placeholder="Enter your username"
              autocomplete="username" required />
            <span class="icon" aria-hidden="true">👤</span>
          </div>
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <div class="input-wrap">
            <input type="password" id="password" name="password"
              placeholder="Enter your password"
              autocomplete="current-password" required />
            <span class="icon" aria-hidden="true">🔒</span>
          </div>
        </div>

        <button type="submit" class="btn-primary" id="loginBtn">Sign In</button>

        <div class="message" id="feedbackMsg" role="alert" aria-live="polite"></div>

      </form>

      <!-- MODE SELECTOR — visible only after a successful admin login -->
      <div class="mode-selector" id="modeSelector">
        <div class="divider" style="margin:0.25rem 0;">choose your view</div>
        <a class="mode-tile admin-tile" href="/dashboard-admin">
          <div class="mode-tile-icon">⚙️</div>
          <div>
            <div class="mode-tile-label">Admin Panel</div>
            <div class="mode-tile-sub">Manage cards, users, credits &amp; news</div>
          </div>
        </a>
        <a class="mode-tile guest-tile" href="/dashboard-guest">
          <div class="mode-tile-icon">🎮</div>
          <div>
            <div class="mode-tile-label">Guest Mode</div>
            <div class="mode-tile-sub">View your cards and balance</div>
          </div>
        </a>
      </div>

      <div class="divider" id="orDivider">or</div>

      <p class="register-link">
        New here? <a href="/register">Create a Guest Account</a>
      </p>

    </div>
  </main>

  <footer>
    Made with &hearts; by Delta, with some AI Assistance by <a href="https://anthropic.com" target="_blank">Anthropic's Claude</a>.
  </footer>
  <script src="js/login.js"></script>
</body>
</html>
